name: Build ByeDPI for Sony Bravia TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (without legacy tools)
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByeDPI-SonyTV-debug
          path: app/build/outputs/apk/debug/*.apk
